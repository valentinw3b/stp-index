<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor STP 3D - Telmedia</title>
    <style>
        * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
        body { background:#f0f4f9; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 20px; }
        .header { width:100%; max-width:1000px; display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
        .title { font-size:22px; font-weight:700; color:#1e3a5f; white-space:nowrap; }
        .search-bar { display:flex; align-items:center; flex:1; min-width:260px; max-width:560px; background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,30,60,.07); overflow:hidden; border:1.5px solid #d0e3f5; transition:border-color .2s; }
        .search-bar:focus-within { border-color:#1a73e8; }
        .search-icon { padding:0 12px; color:#7a9abf; flex-shrink:0; }
        #search-input { flex:1; border:none; outline:none; font-size:13.5px; color:#1e3a5f; padding:11px 0; background:transparent; }
        #search-input::placeholder { color:#a0b8cc; }
        #btn-go { background:#1a73e8; color:#fff; border:none; padding:0 18px; height:44px; cursor:pointer; font-size:13px; font-weight:600; transition:background .15s; white-space:nowrap; }
        #btn-go:hover { background:#1558b0; }
        .viewer-frame { position:relative; width:100%; max-width:1000px; height:560px; background:#e5effa; border-radius:24px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 20px rgba(0,30,60,.06); overflow:hidden; }
        #canvas-container { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; }
        .floating-toolbar { position:absolute; left:16px; top:50%; transform:translateY(-50%); background:#fff; padding:14px 10px; border-radius:18px; box-shadow:0 4px 16px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:18px; align-items:center; z-index:20; }
        .tool-icon { width:20px; height:20px; color:#4a5568; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color .15s; background:none; border:none; }
        .tool-icon:hover { color:#1e3a5f; }
        .tool-icon svg { width:100%; height:100%; stroke:currentColor; stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
        .message-card { position:relative; z-index:10; background:#fff; padding:36px 44px 28px; border-radius:20px; box-shadow:0 6px 24px rgba(0,30,60,.07); display:flex; align-items:center; gap:22px; max-width:580px; width:90%; }
        .spinner { width:28px; height:28px; animation:spin 1.2s linear infinite; flex-shrink:0; color:#1a73e8; }
        @keyframes spin { 100%{ transform:rotate(360deg); } }
        .card-body { display:flex; flex-direction:column; align-items:center; text-align:center; width:100%; }
        .status-heading { color:#1e3a5f; font-size:15px; font-weight:600; line-height:1.5; margin-bottom:8px; }
        .status-heading.error { color:#e04b4b; }
        .sub-text { color:#718096; font-size:13px; margin-bottom:18px; }
        .welcome-icon { font-size:42px; margin-bottom:14px; }
        .indicator-bar { width:100%; max-width:260px; height:4px; background:#c9e0fa; border-radius:4px; overflow:hidden; position:relative; }
        .indicator-progress { width:40%; height:100%; background:#1a73e8; border-radius:4px; position:absolute; animation:pulse-progress 1.6s infinite ease-in-out; }
        @keyframes pulse-progress { 0%{ left:-40%; } 100%{ left:100%; } }
        .file-badge { position:absolute; bottom:14px; right:14px; background:rgba(30,58,95,.75); color:#e8f0fe; font-size:11.5px; padding:5px 12px; border-radius:20px; z-index:20; max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:none; backdrop-filter:blur(6px); }
        #file-input { display:none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.17/dist/occt-import-js.js"></script>
</head>
<body>

<div class="header">
    <h1 class="title">Visor STP 3D</h1>
    <div class="search-bar">
        <span class="search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input id="search-input" type="text" placeholder="ej: axis-p1475-le-en-US-499058.stp" />
        <button id="btn-go">Cargar &rarr;</button>
    </div>
</div>

<div class="viewer-frame" id="viewer-container">
    <div id="canvas-container"></div>
    <div class="floating-toolbar">
        <button class="tool-icon" id="btn-fullscreen" title="Pantalla completa"><svg viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg></button>
        <button class="tool-icon" id="btn-zoom-in" title="Acercar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        <button class="tool-icon" id="btn-zoom-out" title="Alejar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        <button class="tool-icon" id="btn-reset" title="Reiniciar vista"><svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5H6"/><path d="M7 6L3 10l4 4"/></svg></button>
        <button class="tool-icon" id="btn-upload" title="Cargar archivo local"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></button>
        <button class="tool-icon" id="btn-material" title="Solido / Malla"><svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg></button>
    </div>
    <div class="message-card" id="status-card">
        <svg class="spinner" id="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
        <div class="card-body">
            <div class="welcome-icon" id="welcome-icon" style="display:none">&#128230;</div>
            <p class="status-heading" id="status-text">Iniciando...</p>
            <p class="sub-text" id="status-sub"></p>
            <div class="indicator-bar" id="indicator-bar"><div class="indicator-progress"></div></div>
        </div>
    </div>
    <div class="file-badge" id="file-badge"></div>
    <input type="file" id="file-input" accept=".stp,.step">
</div>

<script>
    const WORKER_PROXY  = 'https://flat-bar-7c11.aaaweb50.workers.dev/?url=';
    const TELMEDIA_BASE = 'https://telmedia.com.mx/tm/assets/stp/';

    const container    = document.getElementById('canvas-container');
    const statusCard   = document.getElementById('status-card');
    const statusText   = document.getElementById('status-text');
    const statusSub    = document.getElementById('status-sub');
    const spinnerIcon  = document.getElementById('spinner-icon');
    const indicatorBar = document.getElementById('indicator-bar');
    const welcomeIcon  = document.getElementById('welcome-icon');
    const fileBadge    = document.getElementById('file-badge');
    const fileInput    = document.getElementById('file-input');
    const searchInput  = document.getElementById('search-input');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e5effa');
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
    camera.position.set(150, 150, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05;
    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    var l1 = new THREE.DirectionalLight(0xffffff, 0.7); l1.position.set(150,250,150); scene.add(l1);
    var l2 = new THREE.DirectionalLight(0x9cbcdb, 0.4); l2.position.set(-150,-150,-150); scene.add(l2);

    var currentModel = null;
    var baseMaterial = new THREE.MeshStandardMaterial({ color:0x93b5cf, roughness:0.35, metalness:0.2, side:THREE.DoubleSide });

    function showLoading(n){ statusCard.style.display='flex'; spinnerIcon.style.display='block'; indicatorBar.style.display='block'; welcomeIcon.style.display='none'; statusText.classList.remove('error'); statusText.innerHTML='Cargando <strong>'+n+'</strong>...'; statusSub.innerText='Procesando geometria CAD...'; }
    function showWelcome(){ statusCard.style.display='flex'; spinnerIcon.style.display='none'; indicatorBar.style.display='none'; welcomeIcon.style.display='block'; statusText.classList.remove('error'); statusText.innerHTML='Escribe el nombre de un archivo STP'; statusSub.innerText='Ej: axis-p1475-le-en-US-499058.stp'; fileBadge.style.display='none'; }
    function showError(m){ spinnerIcon.style.display='none'; indicatorBar.style.display='none'; welcomeIcon.style.display='none'; statusText.classList.add('error'); statusText.innerHTML='No se pudo cargar el archivo.'; statusSub.innerText=m; }
    function showModel(n){ statusCard.style.display='none'; fileBadge.style.display='block'; fileBadge.innerText='📄 '+n; }

    async function processStepBuffer(buf, name) {
        statusText.innerHTML='Renderizando <strong>'+name+'</strong>...';
        statusSub.innerText='Calculando geometria 3D...';
        var occt = await occtimportjs();
        var result = occt.ReadStepFile(new Uint8Array(buf), { linearDeflection:0.1, angularDeflection:0.5 });
        if (!result.success || !result.meshes.length) throw new Error('No se pudo procesar la geometria.');
        if (currentModel) scene.remove(currentModel);
        currentModel = new THREE.Group();
        for (var i=0;i<result.meshes.length;i++) {
            var m = result.meshes[i];
            var g = new THREE.BufferGeometry();
            g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(m.attributes.position.array),3));
            if (m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(new Float32Array(m.attributes.normal.array),3));
            else g.computeVertexNormals();
            if (m.index) g.setIndex(new THREE.BufferAttribute(new Uint32Array(m.index.array),1));
            var mat = baseMaterial;
            if (m.color) mat = new THREE.MeshStandardMaterial({ color:new THREE.Color(m.color[0],m.color[1],m.color[2]), roughness:0.35, metalness:0.2, side:THREE.DoubleSide });
            currentModel.add(new THREE.Mesh(g, mat));
        }
        var box = new THREE.Box3().setFromObject(currentModel);
        var center = box.getCenter(new THREE.Vector3());
        var sz = box.getSize(new THREE.Vector3()).length();
        currentModel.position.sub(center);
        scene.add(currentModel);
        camera.position.set(sz*.9,sz*.9,sz*.9);
        controls.target.set(0,0,0); controls.update();
        showModel(name);
    }

    async function loadFromTelmedia(fileName) {
        fileName = fileName.trim();
        if (!fileName) { showWelcome(); return; }
        if (!fileName.match(/\.(stp|step)$/i)) fileName += '.stp';
        showLoading(fileName);
        try {
            var raw  = TELMEDIA_BASE + encodeURIComponent(fileName);
            var url  = WORKER_PROXY + encodeURIComponent(raw);
            var resp = await fetch(url);
            if (!resp.ok) throw new Error('Error '+resp.status+': archivo no encontrado en el servidor.');
            var buf = await resp.arrayBuffer();
            await processStepBuffer(buf, fileName);
        } catch(e) { showError(e.message || 'Error desconocido.'); }
    }

    function getHashFile() { return decodeURIComponent(window.location.hash.slice(1)); }
    function navigateTo(n) { window.location.hash = encodeURIComponent(n.trim()); }
    function handleHashChange() {
        var f = getHashFile();
        if (f) { searchInput.value = f; loadFromTelmedia(f); }
        else { searchInput.value=''; showWelcome(); }
    }
    window.addEventListener('hashchange', handleHashChange);

    document.getElementById('btn-go').onclick = function() {
        var v = searchInput.value.trim(); if (v) navigateTo(v);
    };
    searchInput.addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('btn-go').click(); });

    document.getElementById('btn-upload').onclick = function(){ fileInput.click(); };
    fileInput.onchange = function(e){
        var f=e.target.files[0]; if(!f) return;
        showLoading(f.name);
        var r=new FileReader();
        r.onload=function(ev){ processStepBuffer(ev.target.result,f.name).catch(function(er){showError(er.message);}); };
        r.readAsArrayBuffer(f);
    };

    document.getElementById('btn-zoom-in').onclick = function(){ camera.position.multiplyScalar(.8); controls.update(); };
    document.getElementById('btn-zoom-out').onclick = function(){ camera.position.multiplyScalar(1.2); controls.update(); };
    document.getElementById('btn-reset').onclick = function(){
        if(!currentModel) return;
        var b=new THREE.Box3().setFromObject(currentModel); var sz=b.getSize(new THREE.Vector3()).length();
        camera.position.set(sz*.9,sz*.9,sz*.9); controls.target.set(0,0,0); controls.update();
    };
    document.getElementById('btn-material').onclick = function(){
        if(!currentModel) return;
        currentModel.traverse(function(c){ if(c.isMesh) c.material.wireframe=!c.material.wireframe; });
    };
    document.getElementById('btn-fullscreen').onclick = function(){
        var fr=document.getElementById('viewer-container');
        if(!document.fullscreenElement) fr.requestFullscreen(); else document.exitFullscreen();
    };

    window.onresize = function(){
        camera.aspect=container.clientWidth/container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth,container.clientHeight);
    };

    function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
    animate();
    handleHashChange();
</script>
</body>
</html>
