<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Avanzado 3D (STP v3 - Nube)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f0f4f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      color: #234763;
      margin-bottom: 24px;
      letter-spacing: -0.2px;
    }

    .viewer-frame {
      position: relative;
      width: 100%;
      max-width: 1000px;
      height: 580px;
      background-color: #e5effa;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(0, 30, 60, 0.04);
      overflow: hidden;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Barra lateral flotante */
    .floating-toolbar {
      position: absolute;
      left: 20px;
      background: #ffffff;
      padding: 14px 10px;
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      z-index: 20;
    }

    .tool-icon {
      width: 20px;
      height: 20px;
      color: #4a5568;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
      background: none;
      border: none;
    }

    .tool-icon:hover {
      color: #1e3a5f;
    }

    .tool-icon svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
      stroke-width: 1.9;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tarjeta modal central */
    .message-card {
      position: relative;
      z-index: 10;
      background: #ffffff;
      padding: 40px 48px 32px 48px;
      border-radius: 20px;
      box-shadow: 0 6px 24px rgba(0, 30, 60, 0.05);
      display: flex;
      align-items: center;
      gap: 22px;
      max-width: 600px;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 28px;
      height: 28px;
      animation: spin 1.2s linear infinite;
      flex-shrink: 0;
      color: #1a73e8;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card-body {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .status-heading {
      color: #1e3a5f;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .status-heading.error {
      color: #e04b4b;
    }

    .sub-text {
      color: #718096;
      font-size: 13px;
      font-weight: 400;
      margin-bottom: 18px;
    }

    .indicator-bar {
      width: 100%;
      max-width: 260px;
      height: 4px;
      background-color: #c9e0fa;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .indicator-progress {
      width: 40%;
      height: 100%;
      background-color: #1a73e8;
      border-radius: 4px;
      position: absolute;
      animation: pulse-progress 1.6s infinite ease-in-out;
    }

    @keyframes pulse-progress {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    #file-input { display: none; }
  </style>

  <!-- Librerías 3D y Parser CAD -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.12/dist/occt-import-js.js"></script>
</head>
<body>

  <h1 class="title">Visor Avanzado 3D (STP v3 - Nube)</h1>

  <div class="viewer-frame" id="viewer-container">
    
    <div id="canvas-container"></div>

    <!-- Barra lateral -->
    <div class="floating-toolbar">
      <button class="tool-icon" id="btn-fullscreen" title="Pantalla completa">
        <svg viewBox="0 0 24 24"><path d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0-4l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
      </button>
      <button class="tool-icon" id="btn-zoom-in" title="Acercar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button class="tool-icon" id="btn-zoom-out" title="Alejar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
      </button>
      <button class="tool-icon" id="btn-reset" title="Reiniciar vista">
        <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 0 1 5 5v2a5 5 0 0 1-5 5H6"/><path d="M7 6L3 10l4 4"/></svg>
      </button>
      <button class="tool-icon" id="btn-upload" title="Cargar otro archivo">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <button class="tool-icon" id="btn-material" title="Alternar Malla / Sólido">
        <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
      </button>
    </div>

    <!-- Modal de Carga / Estado -->
    <div class="message-card" id="status-card">
      <svg class="spinner" id="spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="6"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/>
        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/>
        <line x1="2" y1="12" x2="6" y2="12"/>
        <line x1="18" y1="12" x2="22" y2="12"/>
        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/>
        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>
      </svg>

      <div class="card-body">
        <p class="status-heading" id="status-text">
          Extrayendo "axis-c1210-e-network-ceiling-speaker-en-US-448765.stp"...
        </p>
        <p class="sub-text" id="status-sub">
          Obteniendo datos de la nube y triangulando geometría 3D
        </p>
        <div class="indicator-bar" id="indicator-bar"><div class="indicator-progress"></div></div>
      </div>
    </div>

    <input type="file" id="file-input" accept=".stp,.step">
  </div>

  <script>
    const STP_RAW_URL = 'https://telmedia.com.mx/tm/assets/stp/axis-c1210-e-network-ceiling-speaker-en-US-448765.stp';
    const FILE_NAME = 'axis-c1210-e-network-ceiling-speaker-en-US-448765.stp';

    const container = document.getElementById('canvas-container');
    const statusCard = document.getElementById('status-card');
    const statusText = document.getElementById('status-text');
    const statusSub = document.getElementById('status-sub');
    const spinnerIcon = document.getElementById('spinner-icon');
    const indicatorBar = document.getElementById('indicator-bar');
    const fileInput = document.getElementById('file-input');

    // 1. Escena y Renderizador Three.js
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e5effa');

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
    camera.position.set(150, 150, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Iluminación para resaltar detalles CAD
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight1.position.set(150, 250, 150);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0x9cbcdb, 0.45);
    dirLight2.position.set(-150, -150, -150);
    scene.add(dirLight2);

    let currentModel = null;
    let baseMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.35,
      metalness: 0.2,
      side: THREE.DoubleSide
    });

    // 2. Procesamiento de Buffer con Open CASCADE (WASM)
    async function processStepBuffer(arrayBuffer) {
      statusText.innerHTML = `Renderizando <strong>"${FILE_NAME}"</strong>...`;
      statusSub.innerText = 'Calculando mallas y normales B-Rep';

      const occt = await occtimportjs();
      const result = occt.ReadStepFile(new Uint8Array(arrayBuffer), null);

      if (!result.success || !result.meshes.length) {
        throw new Error('No se pudo procesar la geometría 3D del archivo.');
      }

      if (currentModel) scene.remove(currentModel);
      currentModel = new THREE.Group();

      for (const m of result.meshes) {
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
        if (m.attributes.normal) {
          geom.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
        } else {
          geom.computeVertexNormals();
        }
        if (m.index) {
          geom.setIndex(new THREE.BufferAttribute(m.index.array, 1));
        }

        let mat = baseMaterial;
        if (m.color) {
          mat = new THREE.MeshStandardMaterial({
            color: new THREE.Color(m.color[0], m.color[1], m.color[2]),
            roughness: 0.35,
            metalness: 0.2,
            side: THREE.DoubleSide
          });
        }

        currentModel.add(new THREE.Mesh(geom, mat));
      }

      // Centrado de la cámara según la caja contenedora
      const box = new THREE.Box3().setFromObject(currentModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3()).length();

      currentModel.position.sub(center);
      scene.add(currentModel);

      camera.position.set(size * 0.9, size * 0.9, size * 0.9);
      controls.target.set(0, 0, 0);
      controls.update();

      // Esconder mensaje de carga al finalizar
      statusCard.style.display = 'none';
    }

    // 3. Descarga en memoria vía Proxy CORS automático
    async function loadCloudSTP() {
      // Lista de proxies de paso en memoria
      const proxyEndpoints = [
        `https://corsproxy.io/?url=${encodeURIComponent(STP_RAW_URL)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(STP_RAW_URL)}`,
        STP_RAW_URL
      ];

      let buffer = null;

      for (const url of proxyEndpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            buffer = await res.arrayBuffer();
            if (buffer.byteLength > 1000) break; // Validar que traiga contenido
          }
        } catch (e) {
          console.warn(`Intento fallido con ${url}, probando siguiente endpoint...`);
        }
      }

      if (!buffer) {
        spinnerIcon.style.display = 'none';
        indicatorBar.style.display = 'none';
        statusText.classList.add('error');
        statusText.innerHTML = `No se pudo conectar con el archivo en la nube.`;
        statusSub.innerText = 'El servidor remoto rechazó la petición. Abre este archivo desde tu localhost.';
        return;
      }

      try {
        await processStepBuffer(buffer);
      } catch (err) {
        spinnerIcon.style.display = 'none';
        indicatorBar.style.display = 'none';
        statusText.classList.add('error');
        statusText.innerHTML = `Error al interpretar el archivo STP.`;
        statusSub.innerText = err.message;
      }
    }

    // Controles de interfaz
    document.getElementById('btn-upload').onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      statusCard.style.display = 'flex';
      spinnerIcon.style.display = 'block';
      indicatorBar.style.display = 'block';
      statusText.classList.remove('error');
      const reader = new FileReader();
      reader.onload = (ev) => processStepBuffer(ev.target.result);
      reader.readAsArrayBuffer(file);
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      camera.position.multiplyScalar(0.8);
      controls.update();
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      camera.position.multiplyScalar(1.2);
      controls.update();
    };

    document.getElementById('btn-reset').onclick = () => {
      if (currentModel) {
        const box = new THREE.Box3().setFromObject(currentModel);
        const size = box.getSize(new THREE.Vector3()).length();
        camera.position.set(size * 0.9, size * 0.9, size * 0.9);
        controls.target.set(0, 0, 0);
        controls.update();
      }
    };

    document.getElementById('btn-material').onclick = () => {
      if (!currentModel) return;
      currentModel.traverse((child) => {
        if (child.isMesh) {
          child.material.wireframe = !child.material.wireframe;
        }
      });
    };

    document.getElementById('btn-fullscreen').onclick = () => {
      const frame = document.getElementById('viewer-container');
      if (!document.fullscreenElement) frame.requestFullscreen();
      else document.exitFullscreen();
    };

    window.onresize = () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    };

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    loadCloudSTP();
  </script>
</body>
</html>
